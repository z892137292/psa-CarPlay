name: Verify PSA media-control return

on:
  workflow_dispatch:
  push:
    branches: [fix/psa-media-return-20261013]
    paths:
      - 'androidplay-psa/patches/**'
      - 'reports/psa-media-control-return.md'
      - '.github/workflows/verify-psa-media-return.yml'

permissions:
  contents: read

concurrency:
  group: psa-media-return-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;29.0.14206865
      - uses: gradle/actions/setup-gradle@v4
      - name: Materialize fixed upstream and reviewed patches
        run: |
          git clone https://github.com/Roylyl/AndroidPlay.git upstream
          git -C upstream checkout --detach 793e488334a4e0c23459b659c271b7715ae9a9e7
          git -C upstream config user.name 'PSA Build'
          git -C upstream config user.email 'psa-build@users.noreply.github.com'
          git -C upstream am "$GITHUB_WORKSPACE"/androidplay-psa/patches/*.patch
          git -C upstream diff --check 793e488334a4e0c23459b659c271b7715ae9a9e7 HEAD
          chmod +x upstream/gradlew
      - name: Run API 28 unit tests
        working-directory: upstream
        run: ./gradlew -Pandroidplay.sourceOnly=true :shared:testDebugUnitTest :common:testDebugUnitTest --stacktrace
      - name: Run Android lint
        working-directory: upstream
        run: ./gradlew -Pandroidplay.sourceOnly=true :mobile:lintDebug --stacktrace
      - name: Compile source-only APK
        working-directory: upstream
        run: ./gradlew -Pandroidplay.sourceOnly=true :mobile:assembleDebug --stacktrace
      - name: Verify compile artifact and label its limitation
        run: |
          mkdir -p out
          APK=upstream/mobile/build/outputs/apk/debug/mobile-debug.apk
          test -s "$APK"
          ! unzip -l "$APK" | grep -q 'assets/offline-mfi/identity.pk8'
          ! unzip -l "$APK" | grep -q 'assets/offline-mfi/certificate.p7b'
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" > out/APK-INFO.txt
          grep -q "name='com.androidplay.app'" out/APK-INFO.txt
          grep -q "sdkVersion:'28'" out/APK-INFO.txt
          "$SIGNER" verify --verbose --print-certs "$APK" > out/APK-SIGNATURE.txt
          cp "$APK" out/AndroidPlay-PSA-media-return-SOURCE-ONLY-NOT-FOR-CARPLAY.apk
          sha256sum out/*.apk > out/SHA256SUMS.txt
          cat > out/BUILD-STATUS.txt <<'EOF'
          CODE TESTS: PASSED
          LINT: PASSED
          SOURCE COMPILATION: PASSED
          CARPLAY AUTHENTICATION: NOT INCLUDED
          PSA DEVICE VALIDATION: NOT RUN
          This source-only APK is a build artifact, not a connection-test APK.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: PSA-media-return-SOURCE-ONLY-${{ github.sha }}
          path: |
            out/*
            upstream/common/build/reports/tests/
            upstream/shared/build/reports/tests/
            upstream/mobile/build/reports/lint-results-debug.*
          retention-days: 14

