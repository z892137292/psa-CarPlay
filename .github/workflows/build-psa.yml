name: Build PSA CarPlay 0.2.9 Direct lifecycle
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/psa-0.2.9-direct-lifecycle]
permissions:
  contents: write
concurrency:
  group: psa-hotspot-${{ github.ref }}
  cancel-in-progress: false
env:
  RELEASE_TAG: v0.2.9-direct-lifecycle-dev
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Materialize pinned DiPlay mainline with PSA foundation
        run: |
          git clone --depth 1 --branch v0.2.10 https://github.com/shihabal3amri/DiPlay.git upstream
          test "$(git -C upstream rev-parse HEAD)" = "3e43e25c55921bdf5149f5f92851acf202ed353a"
          base64 -d patches/psa-main-0.2.9.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/psa-foundation.patch"
          git -C upstream apply --check "$RUNNER_TEMP/psa-foundation.patch"
          git -C upstream apply "$RUNNER_TEMP/psa-foundation.patch"
      - name: Provision existing upstream runtime authentication
        run: |
          curl --fail --location --retry 3 https://github.com/shihabal3amri/DiPlay/releases/download/v0.2.10/DiPlay-0.2.10.apk --output "$RUNNER_TEMP/upstream.apk"
          mkdir -p "$RUNNER_TEMP/psa-auth/offline-mfi"
          unzip -p "$RUNNER_TEMP/upstream.apk" assets/offline-mfi/identity.pk8 > "$RUNNER_TEMP/psa-auth/offline-mfi/identity.pk8"
          unzip -p "$RUNNER_TEMP/upstream.apk" assets/offline-mfi/certificate.p7b > "$RUNNER_TEMP/psa-auth/offline-mfi/certificate.p7b"
          test -s "$RUNNER_TEMP/psa-auth/offline-mfi/identity.pk8"
          test -s "$RUNNER_TEMP/psa-auth/offline-mfi/certificate.p7b"
      - name: Build standalone development APK
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/psa-auth
        run: |
          cd upstream
          chmod +x gradlew
          ./gradlew :shared:testDebugUnitTest --tests "com.shilapi.xcertplay.airplay.PsaStandardCarPlayProfileTest" --tests "com.shilapi.xcertplay.network.LegacyP2pOwnershipTest" --tests "com.shilapi.xcertplay.network.P2pAddressSelectionTest" --tests "com.shilapi.xcertplay.network.RetainedP2pGroupTest" --tests "com.shilapi.xcertplay.network.ControlProbeSourceTest" --tests "com.shilapi.xcertplay.network.CarPlayBonjourTest" --tests "com.shilapi.xcertplay.network.P2pStartupRecoveryTest" --tests "com.shilapi.xcertplay.network.DirectLifecycleTest" --tests "com.shilapi.xcertplay.transport.Iap2WiredControlClientTest" --tests "com.shilapi.xcertplay.transport.Iap2WirelessControlClientTest" --tests "com.shilapi.xcertplay.transport.UsbMuxIssue100RegressionTest" :common:testDebugUnitTest --tests "com.shilapi.xcertplay.HotspotModeMigrationTest" --tests "com.shilapi.xcertplay.CarPlayHostDisplaySizeTest" --tests "com.shilapi.xcertplay.ControllerCloseGateTest" --tests "com.shilapi.xcertplay.PsaReportStorageTest" --tests "com.shilapi.xcertplay.DiagnosticExportStoreTest" --tests "com.shilapi.xcertplay.DiagnosticRedactorTest" :mobile:assembleStandaloneDebug --stacktrace
      - name: Verify package and stage deliverables
        run: |
          APK="$(find upstream/mobile/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          unzip -l "$APK" | grep -q 'assets/offline-mfi/identity.pk8'
          unzip -l "$APK" | grep -q 'assets/offline-mfi/certificate.p7b'
          mkdir -p out
          cp "$APK" out/PSA-CarPlay-0.2.9-Android9-dev.apk
          SDK_TOOL="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$SDK_TOOL" dump badging "$APK" > out/APK-INFO.txt
          grep -q "name='com.psa.carplay.dev'" out/APK-INFO.txt
          grep -q "sdkVersion:'28'" out/APK-INFO.txt
          SIGN_TOOL="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$SIGN_TOOL" verify --verbose --print-certs "$APK" > out/APK-SIGNATURE.txt
          cp RELEASE-NOTES-0.2.9.md out/
          cp -r upstream/shared/build/test-results/testDebugUnitTest out/shared-test-results
          cp -r upstream/common/build/test-results/testDebugUnitTest out/common-test-results
          cd out
          sha256sum *.apk > SHA256SUMS.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSA-CarPlay-0.2.9-Android9-dev
          path: out/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish development prerelease
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/psa-0.2.9-direct-lifecycle'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title 'PSA CarPlay 0.2.9 Android 9 Direct 生命周期诊断版' --prerelease --notes-file RELEASE-NOTES-0.2.9.md
          fi
          gh release upload "$RELEASE_TAG" out/*
      - name: Preserve build and test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PSA-0.2.9-failure-diagnostics
          path: |
            upstream/shared/build/reports/tests/
            upstream/common/build/reports/tests/
          if-no-files-found: ignore
      - name: Remove temporary credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/psa-auth" "$RUNNER_TEMP/upstream.apk"
